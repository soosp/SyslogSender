name=SyslogSender
version=0.1.3
author=Péter Soós <https://github.com/soosp>
maintainer=Péter Soós <https://github.com/soosp>
sentence=Sends RFC 5424 syslog messages over UDP; forwards ESP_LOG on ESP32.
paragraph=A sender, not a logging framework: frames and sends what ESP_LOG (ESP32), a library's logger callback, or the application hands it. No queue, no heap after begin(), thread-safe on ESP32, host-testable framing. Depends on Host for target validation.
category=Communication
url=https://github.com/soosp/SyslogSender
architectures=esp32,esp8266,avr
depends=Host,Ethernet
includes=SyslogSender.h,SyslogEspLogHook.h
